# 脑珊瑚 coral-memory bundle patch：注册 GUI 设置面板（coral-gui）。
# ⚠️ name 必须用 profile 的链接键 @dsh-external/dsh-client-coral（与既有设置面板插件同款模式）；
#    包内 package.json 的 name 虽是 coral-memory，但 node_modules 里按链接键解析，
#    写 coral-memory 会 ERR_MODULE_NOT_FOUND 导致 dsh web 启动崩溃。
# mcp-coral 由 profile 的 cordis.patch.yml 硬编码路径版提供，这里不重复注册。
- insert:
    - id: coral-gui
      name: '@dsh-external/dsh-client-coral'
